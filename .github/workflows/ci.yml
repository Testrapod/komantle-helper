name: Verify CLI and web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Check Linux Java and Okt compatibility
        run: python -c "from komantle_helper.core import Word; assert Word('사과').pos == '명사'"
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Build synthetic preview under the project path
        run: |
          python -m scripts.demo_data
          python -m scripts.build_site --archive-dir .demo-archive --output .preview/komantle-helper
      - run: npm run test:e2e
